<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame Reveal & Fix</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #050505">
      
      <a-entity id="hinge" position="0 0 -3" rotation="-90 0 0">
        <a-plane 
          id="video-screen" 
          width="2" 
          height="1.2" 
          position="0 0.6 0"
          color="#333"
          material="side: double; shader: flat">
        </a-plane>
      </a-entity>

      <a-grid material="opacity: 0.1; color: #444"></a-grid>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      
      sceneEl.addEventListener('loaded', () => {
        const anime = AFRAME.ANIME;
        const hinge = document.querySelector('#hinge');

        // 1. Removed loop: true so it plays only once
        const tl = anime.timeline({
          easing: 'easeOutExpo', // High-quality smooth finish
          duration: 2000
        });

        // 2. The Flip Action
        tl.add({
          targets: hinge.object3D.rotation,
          x: 0,
        })
        // 3. The Rise Action (Running simultaneously)
        .add({
          targets: hinge.object3D.position,
          y: 2, 
        }, "-=2000"); // Start at the same time as the rotation
      });
    </script>
  </body>
</html>
